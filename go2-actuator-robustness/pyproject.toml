[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-actuator-robustness"
version = "0.2.0"
description = "Engineering extensions and controlled actuator-mismatch evaluation for Unitree Go2"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
include = ["go2_robust*"]
